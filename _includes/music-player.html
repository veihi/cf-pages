{%- assign music_tracks = site.data.music -%}
{% if music_tracks and music_tracks.size > 0 %}
<div id="blog-music" class="blog-music" aria-label="博客视频歌单">
  <button id="music-toggle" class="music-toggle" type="button" aria-expanded="false" aria-controls="music-panel" aria-label="展开歌单">♫</button>
  <section id="music-panel" class="music-panel" hidden aria-label="B站音乐歌单">
    <div class="music-top">
      <div class="music-description"><strong id="music-title">我的歌单</strong><small id="music-artist">B站视频播放</small></div>
      <button id="music-close" class="music-close" type="button" aria-label="收起歌单">×</button>
    </div>
    <div class="music-video">
      <div id="music-placeholder" class="music-placeholder">选择歌曲后，点击视频中的播放按钮</div>
      <iframe id="music-frame" title="B站音乐视频" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen; picture-in-picture" allowfullscreen hidden></iframe>
    </div>
    <div class="music-controls">
      <button id="music-prev" type="button" aria-label="上一首">⏮ 上一首</button>
      <button id="music-next" type="button" aria-label="下一首">下一首 ⏭</button>
    </div>
    <div class="music-playlist">
      <div class="music-list-header"><button id="music-back" class="music-back" type="button" hidden aria-label="返回分类">← 返回</button><strong id="music-list-title">音乐分类</strong><span id="music-count"></span></div>
      <div id="music-track-list" class="music-track-list" role="group" aria-label="歌曲列表"></div>
    </div>
  </section>
</div>
<script id="music-playlist" type="application/json">{{ music_tracks | jsonify }}</script>
<style>
.blog-music{position:fixed;left:18px;top:76px;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263345}
.music-toggle{width:52px;height:52px;border:0;border-radius:50%;background:#fff;color:#3977af;font-size:30px;box-shadow:0 5px 24px #0002;cursor:pointer}
.music-panel{box-sizing:border-box;width:min(390px,calc(100vw - 36px));margin-top:10px;padding:15px;background:rgba(255,255,255,.97);border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 10px 35px #0002;backdrop-filter:blur(14px)}
.music-panel[hidden],.music-video [hidden]{display:none}
.music-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.music-description{display:grid;gap:3px;min-width:0}.music-description strong,.music-description small{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.music-description small{color:#64748b}
.music-close{border:0;background:none;font-size:25px;line-height:1;color:#64748b;cursor:pointer}
.music-video{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#111}
.music-video iframe{display:block;width:100%;height:100%;border:0}
.music-placeholder{display:flex;align-items:center;justify-content:center;height:100%;padding:15px;box-sizing:border-box;text-align:center;color:#e2e8f0;font-size:12px}
.music-controls{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.music-controls button{border:1px solid #dbeafe;border-radius:8px;padding:7px 12px;background:#eff6ff;color:#3977af;cursor:pointer}
.music-controls button:hover{background:#dbeafe}
.music-playlist{margin-top:13px;border-top:1px solid #e2e8f0;padding-top:12px}
.music-list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px}
.music-list-header span{color:#94a3b8;font-size:11px}
.music-back{border:0;background:transparent;color:#3977af;cursor:pointer;padding:3px 6px 3px 0;font-size:12px}
.music-back[hidden]{display:none}
.music-category{display:flex;align-items:center;gap:10px;width:100%;padding:12px 10px;border:0;border-radius:9px;background:transparent;color:#334155;text-align:left;cursor:pointer}
.music-category:hover{background:#f1f5f9}
.music-category-icon{font-size:19px;width:26px;text-align:center}
.music-category-name{flex:1;font-size:13px;font-weight:500}
.music-category-count{font-size:11px;color:#94a3b8}
.music-category-arrow{color:#94a3b8}
.music-track-list{max-height:200px;overflow-y:auto;display:grid;gap:4px}
.music-track{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:9px;background:transparent;color:#334155;text-align:left;cursor:pointer}
.music-track:hover{background:#f1f5f9}.music-track.active{background:#eaf3ff;color:#3977af}
.music-track-number{width:22px;flex-shrink:0;text-align:center;font-size:12px;color:#94a3b8}
.music-track.active .music-track-number{color:#3977af}
.music-track-info{display:grid;gap:3px;min-width:0;flex:1}
.music-track-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:500}
.music-track-artist{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:#94a3b8}
.music-track:focus-visible,.music-controls button:focus-visible,.music-toggle:focus-visible{outline:2px solid #3977af;outline-offset:2px}
@media(max-width:520px){.blog-music{left:auto;top:auto;right:12px;bottom:12px}.music-panel{margin-top:0;margin-bottom:10px;width:min(390px,calc(100vw - 24px));padding:12px}}
</style>
<script>
(function () {
  'use strict';
  const root = document.getElementById('blog-music');
  const panel = document.getElementById('music-panel');
  const toggle = document.getElementById('music-toggle');
  const frame = document.getElementById('music-frame');
  const placeholder = document.getElementById('music-placeholder');
  const title = document.getElementById('music-title');
  const artist = document.getElementById('music-artist');
  const trackList = document.getElementById('music-track-list');
  const trackCount = document.getElementById('music-count');
  const rawGroups = JSON.parse(document.getElementById('music-playlist').textContent);
  const validTrack = t => t && /^BV[0-9A-Za-z]{10}$/.test(String(t.bvid || '')) &&
    (!t.page || (Number.isInteger(Number(t.page)) && Number(t.page) >= 1));
  // Accept both the new grouped format and the previous flat playlist.
  const groups = (Array.isArray(rawGroups) ? rawGroups : []).map(g => {
    if (g && Array.isArray(g.tracks)) {
      return { name: String(g.name || '未分类'), icon: String(g.icon || '♫'), tracks: g.tracks.filter(validTrack) };
    }
    return null;
  }).filter(g => g && g.tracks.length);
  if (!groups.length) {
    const flat = (Array.isArray(rawGroups) ? rawGroups : []).filter(validTrack);
    if (flat.length) groups.push({ name: '全部歌曲', icon: '♫', tracks: flat });
  }
  if (!groups.length) { root.hidden = true; return; }
  const tracks = groups.flatMap(g => g.tracks);
  const back = document.getElementById('music-back');
  const listTitle = document.getElementById('music-list-title');
  let selectedGroup = null;
  let index = 0;
  let loaded = false;

  function updateDetails() {
    const track = tracks[index];
    title.textContent = track.title || '未命名歌曲';
    artist.textContent = track.artist || '';
    renderPlaylist();
  }
  function renderPlaylist() {
    trackList.replaceChildren();
    back.hidden = selectedGroup === null;
    listTitle.textContent = selectedGroup === null ? '音乐分类' : groups[selectedGroup].name;
    if (selectedGroup === null) {
      trackCount.textContent = groups.length + ' 类';
      groups.forEach((group, i) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'music-category';
        const icon = document.createElement('span');
        icon.className = 'music-category-icon';
        icon.textContent = group.icon;
        const name = document.createElement('span');
        name.className = 'music-category-name';
        name.textContent = group.name;
        const count = document.createElement('span');
        count.className = 'music-category-count';
        count.textContent = group.tracks.length + ' 首';
        const arrow = document.createElement('span');
        arrow.className = 'music-category-arrow';
        arrow.textContent = '›';
        button.append(icon, name, count, arrow);
        button.addEventListener('click', () => { selectedGroup = i; renderPlaylist(); });
        trackList.appendChild(button);
      });
      return;
    }
    const group = groups[selectedGroup];
    trackCount.textContent = group.tracks.length + ' 首';
    group.tracks.forEach((track, i) => {
      const globalIndex = tracks.indexOf(track);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'music-track' + (globalIndex === index ? ' active' : '');
      button.setAttribute('aria-label', '选择 ' + (track.title || '未命名歌曲'));
      if (globalIndex === index) button.setAttribute('aria-current', 'true');
      const number = document.createElement('span');
      number.className = 'music-track-number';
      number.textContent = globalIndex === index ? '♫' : String(i + 1);
      const info = document.createElement('span');
      info.className = 'music-track-info';
      const name = document.createElement('span');
      name.className = 'music-track-title';
      name.textContent = track.title || '未命名歌曲';
      const singer = document.createElement('span');
      singer.className = 'music-track-artist';
      singer.textContent = track.artist || '';
      info.append(name, singer);
      button.append(number, info);
      button.addEventListener('click', () => selectTrack(globalIndex));
      trackList.appendChild(button);
    });
  }
  function loadSelected() {
    const track = tracks[index];
    const url = new URL('https://player.bilibili.com/player.html');
    url.searchParams.set('bvid', track.bvid);
    url.searchParams.set('autoplay', '0');
    url.searchParams.set('danmaku', '0');
    if (track.page) url.searchParams.set('page', String(track.page));
    frame.src = url.toString();
    frame.hidden = false;
    placeholder.hidden = true;
    loaded = true;
  }
  function selectTrack(i) {
    if (i < 0 || i >= tracks.length) return;
    if (index === i && loaded) return;
    index = i;
    updateDetails();
    loadSelected();
  }
  function changeTrack(step) {
    const groupIndex = groups.findIndex(g => g.tracks.includes(tracks[index]));
    const currentGroup = groups[groupIndex];
    const localIndex = currentGroup.tracks.indexOf(tracks[index]);
    const next = currentGroup.tracks[(localIndex + step + currentGroup.tracks.length) % currentGroup.tracks.length];
    selectTrack(tracks.indexOf(next));
  }
  function setOpen(open) {
    panel.hidden = !open;
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', open ? '收起歌单' : '展开歌单');
    if (open && !loaded) loadSelected();
  }
  back.addEventListener('click', () => { selectedGroup = null; renderPlaylist(); });
  toggle.addEventListener('click', () => setOpen(panel.hidden));
  document.getElementById('music-close').addEventListener('click', () => setOpen(false));
  document.getElementById('music-prev').addEventListener('click', () => changeTrack(-1));
  document.getElementById('music-next').addEventListener('click', () => changeTrack(1));
  updateDetails();
})();
</script>
{% endif %}
