title: veihi的档案库
author: 联系我
email: veihi@veihi.uk
description: 感谢您的阅读
baseurl: ""
url: "https://veihi.uk"
theme: minima

# Promotion is paused. Exclude the page even for --unpublished builds.
# Internal handoff documents contain promotion URLs and are not public pages.
exclude:
  - games.md
  - docs/
  - AGENTS.md
  # Keep the Astro preview source out of any remaining Jekyll builds.
  - src/
  - public/
  - scripts/
  - astro.config.mjs
  - package.json
  - package-lock.json
  - README.md

# Copy Cloudflare Pages routing rules into the generated site.
include:
  - _redirects
